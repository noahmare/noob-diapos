<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz DHCP : Test tes connaissances réseau · Quiz Noob → Pro Info</title>
<meta name="description" content="6 questions pour te tester. Affirme-toi sur le protocole qui gère nos adresses IP en un clic. Idéal pour ceux qui veulent devenir des pros du réseau, même si tu es encore débutant.">
<meta property="og:title" content="Quiz DHCP : Test tes connaissances réseau">
<meta property="og:description" content="6 questions pour te tester. Affirme-toi sur le protocole qui gère nos adresses IP en un clic. Idéal pour ceux qui veulent devenir des pros du réseau, même si tu es encore débutant.">
<meta name="theme-color" content="#0B0A17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #0B0A17; --panel: #171330; --raised: #221B42; --line: #342A63; --text: #F7F5FF; --muted: #B3ABD9; --lime: #C6FF3D; --violet: #8B6CFF; --ok: #3DFFB0; --bad: #FF5C93; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 Onest, system-ui, sans-serif; }
body { min-height: 100dvh; background: radial-gradient(120% 60% at 100% 0%, rgba(198,255,61,.10), transparent 60%), radial-gradient(90% 60% at 0% 100%, rgba(139,108,255,.22), transparent 60%), var(--bg); }
main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); }
h1, h2, .big { font-family: Unbounded, system-ui, sans-serif; letter-spacing: -.01em; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible + .switch { outline: 3px solid var(--lime); outline-offset: 3px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.top img { width: 38px; height: 38px; border-radius: 50%; }
.top b { font-family: Unbounded, sans-serif; font-size: .9rem; }
.top small { display: block; color: var(--muted); font-size: .78rem; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px; }
.cta { display: block; width: 100%; border: 0; border-radius: 999px; padding: 17px 20px; background: var(--lime); color: var(--bg); font-family: Unbounded, sans-serif; font-weight: 800; font-size: 1.05rem; }
.cta:active { transform: scale(.98); }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 14px 18px; width: 100%; font-weight: 700; }
.muted { color: var(--muted); }
/* accueil */
.intro h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); line-height: 1.08; margin: 6px 0 12px; }
.facts { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 22px; padding: 0; list-style: none; }
.facts li { background: var(--raised); border-radius: 999px; padding: 6px 13px; font-size: .9rem; }
.chrono { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 20px; border-top: 1px solid var(--line); margin-top: 6px; }
.chrono input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { width: 52px; height: 30px; border-radius: 99px; background: var(--raised); border: 2px solid var(--line); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.chrono input:checked + .switch { background: var(--violet); border-color: var(--violet); }
.chrono input:checked + .switch::after { transform: translateX(22px); background: var(--text); }
.best { margin: 14px 0 0; text-align: center; font-size: .9rem; }
/* barre de progression */
.hud { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-weight: 700; font-size: .95rem; }
.streak { background: var(--raised); border-radius: 99px; padding: 4px 12px; transition: background .3s; }
.streak.hot { background: var(--lime); color: var(--bg); }
.steps { display: flex; gap: 5px; margin-bottom: 16px; }
.steps i { flex: 1; height: 7px; border-radius: 9px; background: var(--raised); }
.steps i.ok { background: var(--ok); } .steps i.ko { background: var(--bad); } .steps i.now { background: var(--violet); }
.timer { height: 5px; border-radius: 9px; background: var(--raised); overflow: hidden; margin: -8px 0 16px; }
.timer b { display: block; height: 100%; background: var(--lime); transform-origin: left; }
/* question */
.photo { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 18px; display: block; margin-bottom: 16px; background: var(--raised); }
.kind { display: inline-block; font-size: .8rem; font-weight: 700; color: var(--lime); margin-bottom: 6px; }
.q { font-size: clamp(1.25rem, 5.6vw, 1.6rem); line-height: 1.25; margin: 0 0 18px; }
.choices { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.choice { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--raised); border: 2px solid var(--line); border-radius: 18px; padding: 15px 16px; font-weight: 600; font-size: 1.02rem; transition: border-color .15s, background .15s, transform .15s; }
.choice .l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-family: Unbounded, sans-serif; font-size: .85rem; }
.choice:hover:not(:disabled) { border-color: var(--violet); }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--ok); background: rgba(61,255,176,.14); }
.choice.right .l { background: var(--ok); color: var(--bg); }
.choice.wrong { border-color: var(--bad); background: rgba(255,92,147,.14); }
.choice.wrong .l { background: var(--bad); color: var(--bg); }
.choice.dim { opacity: .5; }
.feedback { margin-top: 16px; padding: 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); }
.feedback h2 { font-size: 1.05rem; margin-bottom: 6px; }
.feedback.ok h2 { color: var(--ok); } .feedback.ko h2 { color: var(--bad); }
.feedback p { margin: 0 0 14px; }
.pts { float: right; font-family: Unbounded, sans-serif; color: var(--lime); font-size: .95rem; }
/* résultat */
.result { text-align: center; }
.score { font-size: clamp(3.4rem, 18vw, 5rem); line-height: 1; margin: 10px 0 4px; color: var(--lime); }
.result h2 { font-size: 1.35rem; margin: 14px 0 8px; }
.stats { display: flex; justify-content: center; gap: 10px; margin: 16px 0 20px; flex-wrap: wrap; }
.stats span { background: var(--raised); border-radius: 14px; padding: 10px 14px; font-size: .9rem; }
.stats b { display: block; font-family: Unbounded, sans-serif; font-size: 1.1rem; }
.review { text-align: left; margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.review li { background: var(--raised); border-radius: 14px; padding: 12px 14px; font-size: .92rem; border-left: 5px solid var(--ok); }
.review li.ko { border-left-color: var(--bad); }
.review small { display: block; color: var(--muted); margin-top: 3px; }
.row { display: grid; gap: 10px; margin-top: 18px; }
.follow { display: block; text-align: center; margin-top: 20px; color: var(--muted); }
.follow a { color: var(--lime); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: no-preference) {
  .enter { animation: enter .35s cubic-bezier(.2,.8,.2,1); }
  .choice.wrong { animation: shake .35s; }
  .choice.right { animation: pop .3s; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pop { 50% { transform: scale(1.03); } }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const QUIZ = {"id":"79132cafbe","title":"Quiz DHCP : Test tes connaissances réseau","brand":"Noob → Pro Info","handle":"@noob.to.pro.info","questions":[{"type":"qcm","question":"Quand tu te connectes à ton Wi-Fi maison, quel port UDP écoute le serveur DHCP ?","choices":["67","69","68"],"answer":0,"explanation":"Le serveur DHCP écoute sur le port 67 en UDP. Le client utilise le port 68 comme source.","difficulty":1,"photo_query":"","image":"q1.jpg"},{"type":"qcm","question":"Dans le processus DORA, quel message est envoyé en broadcast par le client ?","choices":["Acknowledge","Discover","Offer"],"answer":1,"explanation":"Le client commence par un DISCOVER envoyé en broadcast afin de trouver un serveur DHCP.","difficulty":1,"photo_query":"","image":"q2.jpg"},{"type":"qcm","question":"Quelle information n’est PAS transmise dans le message OFFER ?","choices":["Le bail associé","Le nom du PC","Une adresse IP proposée"],"answer":1,"explanation":"L’OFFER comprend l’adresse IP, le bail et parfois d’autres options, mais pas le nom du PC, qui n’est pas encore connu.","difficulty":2,"photo_query":"","image":"q3.jpg"},{"type":"vrai_faux","question":"Un serveur DHCP peut donner la même adresse IP à deux clients différents en même temps.","choices":["Vrai","Faux"],"answer":1,"explanation":"Un serveur DHCP assure l’unicité d’une adresse IP. Si deux clients reçoivent la même IP, il y aura un conflit.","difficulty":2,"photo_query":"","image":"q4.jpg"},{"type":"qcm","question":"Quel est le rôle d’une réservation DHCP ?","choices":["Attribuer toujours la même IP à la même MAC","Limiter le bail d’une adresse","Forcer toutes les machines à utiliser la même IP"],"answer":0,"explanation":"La réservation assure qu’une adresse IP donnée est toujours attribuée au même appareil (MAC).","difficulty":3,"photo_query":"","image":"q5.jpg"},{"type":"qcm","question":"Le relais DHCP permet de faire passer les requêtes d’un VLAN vers un serveur DHCP situé sur un autre sous-réseau. Quel est son principal « porte-parole »?","choices":["Le DHCP Relay Agent","Le Routeur","Le Switch"],"answer":0,"explanation":"Le Relay Agent (NDPR) injecte les options de relais pour transmettre la requête hors du sous-réseau d’origine.","difficulty":3,"photo_query":"","image":"q6.jpg"}]};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KIND = { qcm: "Trois choix", vrai_faux: "Vrai ou faux", piege: "Question piège" };
const LIMIT = 15; // secondes par question en défi chrono
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const bestKey = `quiz-${QUIZ.id}-best`;
let st;

function header() {
  return `<div class="top"><img src="logo.png" alt=""><div><b>${esc(QUIZ.brand)}</b><small>${esc(QUIZ.handle)}</small></div></div>`;
}

function intro() {
  const best = store.get(bestKey);
  $("#app").innerHTML = `${header()}<section class="card intro enter">
    <span class="kind">Quiz</span><h1>${esc(QUIZ.title)}</h1>
    <ul class="facts"><li>${QUIZ.questions.length} questions</li><li>de facile à difficile</li><li>environ ${Math.max(1, Math.round(QUIZ.questions.length * 20 / 60))} min</li></ul>
    <label class="chrono"><span><b>Défi chrono</b><br><span class="muted">${LIMIT} secondes par question, des points en plus si tu vas vite</span></span><input type="checkbox" id="chrono"><span class="switch" aria-hidden="true"></span></label>
    <button class="cta" id="go">C'est parti</button>
    ${best ? `<p class="best muted">Ton meilleur score : <b>${best.good}/${QUIZ.questions.length}</b> (${best.points} points)</p>` : ""}
  </section>`;
  $("#go").onclick = () => start($("#chrono").checked);
  $("#go").focus();
}

function start(chrono) {
  st = { i: 0, good: 0, points: 0, streak: 0, bestStreak: 0, chrono, answers: [] };
  question();
}

function question() {
  const q = QUIZ.questions[st.i];
  const n = QUIZ.questions.length;
  $("#app").innerHTML = `${header()}
    <div class="hud"><span>Question ${st.i + 1}/${n}</span><span class="streak ${st.streak >= 2 ? "hot" : ""}" aria-label="Série de bonnes réponses">Série : ${st.streak}</span><span>${st.points} pts</span></div>
    <div class="steps" aria-hidden="true">${QUIZ.questions.map((_, k) => `<i class="${k < st.i ? (st.answers[k].ok ? "ok" : "ko") : k === st.i ? "now" : ""}"></i>`).join("")}</div>
    ${st.chrono ? `<div class="timer" aria-hidden="true"><b id="bar"></b></div>` : ""}
    <section class="card enter">
      ${q.image ? `<img class="photo" src="${esc(q.image)}" alt="">` : ""}
      <span class="kind">${KIND[q.type] || "Question"}${q.difficulty === 3 ? " · difficile" : ""}</span>
      <h2 class="q" id="q" tabindex="-1">${esc(q.question)}</h2>
      <ul class="choices">${q.choices.map((c, k) => `<li><button class="choice" data-k="${k}"><span class="l">${q.type === "vrai_faux" ? (k ? "F" : "V") : "ABC"[k]}</span>${esc(c)}</button></li>`).join("")}</ul>
      <div id="fb"></div>
    </section>`;
  $("#q").focus();
  document.querySelectorAll(".choice").forEach((b) => (b.onclick = () => answer(+b.dataset.k)));
  st.t0 = performance.now();
  if (st.chrono) {
    const bar = $("#bar");
    const tick = () => {
      const left = 1 - (performance.now() - st.t0) / (LIMIT * 1000);
      if (st.locked) return;
      if (left <= 0) return answer(-1);
      bar.style.transform = `scaleX(${left})`;
      st.raf = requestAnimationFrame(tick);
    };
    st.raf = requestAnimationFrame(tick);
  }
  st.locked = false;
}

function answer(k) {
  if (st.locked) return;
  st.locked = true;
  cancelAnimationFrame(st.raf);
  const q = QUIZ.questions[st.i];
  const ok = k === q.answer;
  const secs = (performance.now() - st.t0) / 1000;
  // points : 100 par bonne réponse, +20 par réponse d'affilée, + bonus de vitesse en défi chrono. Rien d'autre.
  let pts = 0;
  if (ok) { st.streak++; st.good++; pts = 100 + 20 * (st.streak - 1) + (st.chrono ? Math.round(Math.max(0, LIMIT - secs) * 4) : 0); }
  else st.streak = 0;
  st.points += pts;
  st.bestStreak = Math.max(st.bestStreak, st.streak);
  st.answers.push({ ok, k });
  document.querySelectorAll(".choice").forEach((b) => {
    const j = +b.dataset.k;
    b.disabled = true;
    b.classList.add(j === q.answer ? "right" : j === k ? "wrong" : "dim");
  });
  const title = k === -1 ? "Temps écoulé" : ok ? (st.streak >= 3 ? `Bien vu, ${st.streak} d'affilée !` : "Bien vu !") : "Pas tout à fait";
  const last = st.i === QUIZ.questions.length - 1;
  $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "ko"} enter" role="status">
    ${pts ? `<span class="pts">+${pts}</span>` : ""}<h2>${title}</h2>
    <p>${ok ? "" : `La bonne réponse : <b>${esc(q.choices[q.answer])}</b>. `}${esc(q.explanation)}</p>
    <button class="cta" id="next">${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
  $("#next").focus();
  $("#next").onclick = () => { st.i++; last ? result() : question(); };
}

function verdict(r) {
  if (r === 1) return ["Sans faute.", "Tu peux l'expliquer à tes potes, et même au prof."];
  if (r >= 0.8) return ["Très solide.", "Encore une ou deux notions à verrouiller et c'est parfait."];
  if (r >= 0.5) return ["Bonne base.", "Relis les explications des questions ratées, puis retente : ça rentre vite."];
  return ["C'est le début.", "Chaque explication est faite pour toi. Rejoue, tu verras la différence."];
}

function result() {
  const n = QUIZ.questions.length;
  const [h, p] = verdict(st.good / n);
  const best = store.get(bestKey);
  const record = !best || st.points > best.points;
  if (record) store.set(bestKey, { good: st.good, points: st.points });
  $("#app").innerHTML = `${header()}<section class="card result enter">
    <span class="kind">Ton résultat</span>
    <p class="big score">${st.good}/${n}</p>
    <h2 id="r" tabindex="-1">${h}</h2><p class="muted">${p}</p>
    <div class="stats"><span><b>${st.points}</b>points</span><span><b>${st.bestStreak}</b>meilleure série</span>${record && best ? `<span><b>Record</b>battu</span>` : ""}</div>
    <div class="row"><button class="cta" id="share">Partager mon score</button><button class="ghost" id="again">Rejouer</button></div>
    <ul class="review">${QUIZ.questions.map((q, k) => `<li class="${st.answers[k].ok ? "" : "ko"}"><span class="sr">${st.answers[k].ok ? "Juste" : "Faux"} : </span>${esc(q.question)}<small>Réponse : ${esc(q.choices[q.answer])}</small></li>`).join("")}</ul>
    <p class="follow">Un quiz par semaine sur <a href="https://www.tiktok.com/@${esc(QUIZ.handle.replace("@", ""))}" rel="noopener">${esc(QUIZ.handle)}</a></p>
  </section>`;
  $("#r").focus();
  $("#again").onclick = intro;
  $("#share").onclick = async () => {
    const text = `J'ai fait ${st.good}/${n} au quiz « ${QUIZ.title} » de ${QUIZ.handle}. Tu fais mieux ?`;
    try {
      if (navigator.share) await navigator.share({ title: QUIZ.title, text, url: location.href });
      else { await navigator.clipboard.writeText(`${text} ${location.href}`); toast("Lien copié, colle-le où tu veux"); }
    } catch (e) { if (e.name !== "AbortError") toast("Partage impossible sur ce navigateur"); }
  };
}

function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2600); }
intro();
</script>
</body>
</html>
